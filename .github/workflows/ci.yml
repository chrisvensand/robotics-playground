name: ci

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazelisk-cache: true

      - name: Configure BuildBuddy
        run: echo "build:remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" >> .bazelrc.user

      - name: Test
        run: bazel test //... --config=remote

      - name: Build OCI image
        run: bazel build //inference/cartpole_runner:cartpole_runner_image --config=remote

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazelisk-cache: true

      - name: Configure BuildBuddy
        run: echo "build:remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" >> .bazelrc.user

      - name: Test
        run: bazel test //... --config=remote
