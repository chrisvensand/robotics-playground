name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-playground:devcontainer

jobs:
  devcontainer:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          push: true
          tags: ${{ env.DEVCONTAINER_IMAGE }}
          cache-from: type=registry,ref=${{ env.DEVCONTAINER_IMAGE }}
          cache-to: type=inline

  lint:
    needs: devcontainer
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/${{ github.repository_owner }}/robotics-playground:devcontainer
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pre-commit run --all-files

  build-and-test:
    needs: devcontainer
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/${{ github.repository_owner }}/robotics-playground:devcontainer
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure BuildBuddy
        run: echo "build:remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" >> .bazelrc.user

      - name: Test
        run: bazel test //... --config=remote

      - name: Build OCI image
        run: bazel build //inference/cartpole_runner:cartpole_runner_image --config=remote
