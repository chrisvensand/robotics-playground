name: release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DEVCONTAINER_IMAGE: ghcr.io/${{ github.repository_owner }}/robotics-playground:devcontainer

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/robotics-playground:devcontainer
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure BuildBuddy
        run: echo "build:remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" >> .bazelrc.user

      - name: Build
        run: |
          bazel build \
            //inference/cartpole_runner:cartpole_runner \
            //inference/cartpole_runner:cartpole_runner_image \
            --config=release \
            --config=remote

      - name: Stage artifacts
        run: |
          cp bazel-bin/inference/cartpole_runner/cartpole_runner \
             cartpole_runner-${GITHUB_REF_NAME}-linux-arm64
          cp bazel-bin/model/cartpole/cartpole_policy.bin \
             cartpole_policy-${GITHUB_REF_NAME}.bin

      - name: Generate manifest
        run: |
          python3 tools/release/make_manifest.py \
            "${GITHUB_REF_NAME#v}" \
            "cartpole_runner-${GITHUB_REF_NAME}-linux-arm64" \
            "cartpole_policy-${GITHUB_REF_NAME}.bin" \
            > manifest.json
          cat manifest.json

      - name: Sign manifest
        run: |
          echo "${{ secrets.RELEASE_SIGNING_KEY }}" > /tmp/signing_key.pem
          openssl dgst -sha256 \
            -sign /tmp/signing_key.pem \
            -out manifest.json.sig \
            manifest.json
          rm -f /tmp/signing_key.pem
          openssl dgst -sha256 \
            -verify keys/release_public_key.pem \
            -signature manifest.json.sig \
            manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cartpole_runner-*
            cartpole_policy-*
            manifest.json
            manifest.json.sig
          generate_release_notes: true
